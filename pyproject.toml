[project]
name = "openmc"
version = "0.1.0"
description = "An open-source CLI tool for managing Minecraft servers on Linux"
readme = "README.md"
authors = [
    { email = "bradrugo@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
openmc = "openmc:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
